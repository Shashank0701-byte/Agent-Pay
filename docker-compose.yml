services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AgentPay
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/agentpay
      SECRET_KEY: change-this-secret-key
      RAZORPAY_KEY_ID: rzp_test_key
      RAZORPAY_KEY_SECRET: change-me
      WEBHOOK_SECRET: change-me
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: agentpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentpay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
